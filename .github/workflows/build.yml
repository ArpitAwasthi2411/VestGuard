name: Build VestGuard

on:
  push:
    branches: [app-v1, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install web/native packages
        working-directory: app
        run: npm ci

      - name: Copy web app into the Android project
        working-directory: app
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/capacitor.js
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: failure()
        run: python3 .github/report_errors.py build.log "Android build"

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/VestGuard.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: VestGuard-apk
          path: out/VestGuard.apk

      - name: Publish as "latest app" download
        if: github.ref == 'refs/heads/app-v1' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: VestGuard app (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest VestGuard caregiver app, built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download **VestGuard.apk** on the phone and install it (allow "install unknown apps" when asked).
          files: out/VestGuard.apk

  firmware:
    name: Vest firmware (compile + detector test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detector test on recorded data
        run: |
          g++ -O2 -std=c++17 -Wall -Ifirmware/vestguard_vest firmware/test/detector_test.cpp -o detector_test
          ./detector_test data/vestguard_dataset_2026-10-06_clean.csv | tee detector_report.txt
          ./detector_test data/vestguard_dataset_2026-10-08.csv | tee -a detector_report.txt
          echo "--- every trial played backwards (= getting up fast); none may alarm ---" | tee -a detector_report.txt
          ./detector_test data/vestguard_dataset_2026-10-06_clean.csv --reverse | tee -a detector_report.txt
          ./detector_test data/vestguard_dataset_2026-10-08.csv --reverse | tee -a detector_report.txt
          echo "--- upper sensor unplugged: lower sensor alone ---" | tee -a detector_report.txt
          ./detector_test data/vestguard_dataset_2026-10-06_clean.csv --lower | tee -a detector_report.txt
          ./detector_test data/vestguard_dataset_2026-10-08.csv --lower | tee -a detector_report.txt

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile vest firmware (ESP32-S3)
        shell: bash
        run: |
          set -o pipefail
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --warnings default \
            --output-dir build/vest firmware/vestguard_vest 2>&1 | tee fw.log
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc \
            --output-dir build/daq firmware/vestguard_daq 2>&1 | tee -a fw.log

      - name: Report firmware errors
        if: failure()
        run: python3 .github/report_errors.py fw.log "Firmware build"

      - uses: actions/upload-artifact@v4
        with:
          name: vest-firmware
          path: |
            build/vest/*.bin
            detector_report.txt
